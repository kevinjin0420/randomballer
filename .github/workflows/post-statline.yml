name: Post random statline

on:
  # triggered via cron-job.org
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: post
        continue-on-error: true
        run: python3 scripts/post_statline.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - if: steps.post.outcome == 'failure'
        run: sleep 3600 && python3 scripts/post_statline.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
